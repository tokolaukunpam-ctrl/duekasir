name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: flutter config --no-enable-windows-desktop
      - run: sed -i 's/print_bluetooth_thermal:.*/print_bluetooth_thermal: 1.2.1/' pubspec.yaml
      - run: flutter pub get || true
      - run: python3 -c "import glob,re; [open(p,'w').write(re.sub(r'\n\s+windows:\n(?:\s+.*\n)+','\n',open(p).read())) for p in glob.glob('/home/runner/.pub-cache/hosted/pub.dev/print_bluetooth_thermal-*/pubspec.yaml')]"
      - run: sed -i -E "s/1\.7\.10/1.9.22/g; s/1\.8\.22/1.9.22/g" android/settings.gradle; sed -i -E "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle; sed -i "s/compileSdkVersion.*/compileSdkVersion 34/" android/app/build.gradle; sed -i "s/targetSdkVersion.*/targetSdkVersion 34/" android/app/build.gradle
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - run: ls build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
