name: Build DR Aquatic APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - run: flutter config --no-enable-windows-desktop --no-enable-macos-desktop --no-enable-linux-desktop --no-enable-web

      - name: Download deps (allow fail to get cache)
        run: flutter pub get || true

      - name: Patch broken plugin & old gradle
        run: |
          echo "Patching print_bluetooth_thermal..."
          find $HOME -type f -name "pubspec.yaml" -path "*print_bluetooth_thermal*" -exec sed -i '/windows:/d' {} \; 2>/dev/null || true
          find $HOME -type f -name "pubspec.yaml" -path "*print_bluetooth_thermal*" -exec sed -i '/PrintBluetoothThermalPlugin:windows/d' {} \; 2>/dev/null || true
          find $HOME/.pub-cache -type f -name "pubspec.yaml" -path "*print_bluetooth_thermal*" -exec sed -i '/windows:/d' {} \; 2>/dev/null || true
          find $HOME/.pub-cache -type f -name "pubspec.yaml" -path "*print_bluetooth_thermal*" -exec sed -i '/PrintBluetoothThermalPlugin:windows/d' {} \; 2>/dev/null || true
          echo "Patching Kotlin & Gradle & SDK..."
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i 's/ext.kotlin_version = ".*"/ext.kotlin_version = "1.9.22"/' android/build.gradle || true
          sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:7.4.2'/" android/build.gradle || true
          sed -i "s/compileSdkVersion.*/compileSdkVersion 33/" android/app/build.gradle || true
          sed -i "s/compileSdk.*/compileSdk 33/" android/app/build.gradle || true
          sed -i "s/targetSdkVersion.*/targetSdkVersion 33/" android/app/build.gradle || true
          sed -i "s/targetSdk.*/targetSdk 33/" android/app/build.gradle || true

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: DR-Aquatic-APK
          path: build/app/outputs/flutter-apk/app-release.apk
