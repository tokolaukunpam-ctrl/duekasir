name: Build DR Aquatic APK FINAL
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - name: Step 1 - Lock plugin version
        run: |
          flutter config --no-enable-windows-desktop --no-enable-macos-desktop --no-enable-linux-desktop --no-enable-web
          sed -i 's/print_bluetooth_thermal:.*/print_bluetooth_thermal: 1.2.1/' pubspec.yaml

      - run: flutter pub get || true

      - name: Step 2 - Patch plugin (hapus windows doang)
        run: |
          python3 << 'PY'
          import os, glob, re
          paths = glob.glob(os.path.expanduser("~/.pub-cache/**/print_bluetooth_thermal*/pubspec.yaml"), recursive=True)
          for p in set(paths):
            try:
              with open(p) as f: txt=f.read()
              # hapus blok windows dengan regex
              txt = re.sub(r'\n\s{6}windows:\n(?:\s{8}.*\n)+', '\n', txt)
              with open(p,'w') as f: f.write(txt)
              print(f"patched {p}")
            except Exception as e:
              print(e)
          PY

      - name: Step 3 - PATCH KOTLIN & GRADLE PATEN
        run: |
          echo "Before:"
          cat android/build.gradle
          # patch semua kemungkinan format kutip
          sed -i -E "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i -E 's/ext.kotlin_version = ".*"/ext.kotlin_version = "1.9.22"/' android/build.gradle
          sed -i -E "s/kotlin_version = '.*'/kotlin_version = '1.9.22'/" android/build.gradle
          sed -i -E 's/kotlin_version = ".*"/kotlin_version = "1.9.22"/' android/build.gradle
          sed -i -E "s/org.jetbrains.kotlin:kotlin-gradle-plugin:[0-9.]+/org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22/" android/build.gradle
          sed -i -E "s/com.android.tools.build:gradle:[0-9.]+/com.android.tools.build:gradle:7.4.2/" android/build.gradle
          sed -i "s/compileSdkVersion.*/compileSdkVersion 34/" android/app/build.gradle
          sed -i "s/compileSdk.*/compileSdk 34/" android/app/build.gradle
          sed -i "s/targetSdkVersion.*/targetSdkVersion 34/" android/app/build.gradle
          sed -i "s/targetSdk.*/targetSdk 34/" android/app/build.gradle
          # update gradle wrapper
          sed -i "s/gradle-.*-all.zip/gradle-7.5-all.zip/" android/gradle/wrapper/gradle-wrapper.properties || true
          echo "After:"
          cat android/build.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: DR-Aquatic-APK-FINAL-LULUS
          path: build/app/outputs/flutter-apk/app-release.apk
