name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: false
      - run: |
          flutter --version
          flutter config --no-enable-windows-desktop --no-enable-macos-desktop --no-enable-linux-desktop --no-enable-web
          flutter pub get
          find $HOME/.pub-cache -path *print_bluetooth_thermal* -name pubspec.yaml -exec sed -i '/windows:/d' {} \;
          sed -i 's/1.7.10/1.9.10/g' android/settings.gradle
          sed -i 's/1.8.22/1.9.10/g' android/settings.gradle
          sed -i 's/7.0.2/7.4.2/g' android/build.gradle
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: DR-Aquatic-APK
          path: build/app/outputs/flutter-apk/app-release.apk
