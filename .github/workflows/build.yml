name: Build DR Aquatic APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - name: Disable desktop & first get
        run: |
          flutter config --no-enable-windows-desktop --no-enable-macos-desktop --no-enable-linux-desktop --no-enable-web
          flutter pub get || true

      - name: PATCH PATEN - Fix plugin cacat + Kotlin + Gradle + SDK
        run: |
          echo "=== PATCH PLUGIN ==="
          find / -type f -path "*print_bluetooth_thermal*/pubspec.yaml" 2>/dev/null | while read f; do
            echo "Patching $f"
            sed -i '/windows:/d' "$f"
            sed -i '/PrintBluetoothThermalPlugin:windows/d' "$f"
            sed -i '/pluginClass: PrintBluetoothThermalPlugin/d' "$f"
          done
          # Patch proyek utama
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i 's/ext.kotlin_version = ".*"/ext.kotlin_version = "1.9.22"/' android/build.gradle
          sed -i "s/org.jetbrains.kotlin:kotlin-gradle-plugin:.*/org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'/" android/build.gradle || true
          sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:7.4.2'/" android/build.gradle
          sed -i "s/compileSdkVersion.*/compileSdkVersion 34/" android/app/build.gradle
          sed -i "s/compileSdk.*/compileSdk 34/" android/app/build.gradle
          sed -i "s/targetSdkVersion.*/targetSdkVersion 34/" android/app/build.gradle
          sed -i "s/targetSdk.*/targetSdk 34/" android/app/build.gradle
          echo "=== PATCH DONE ==="

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: DR-Aquatic-APK-PATEN
          path: build/app/outputs/flutter-apk/app-release.apk
