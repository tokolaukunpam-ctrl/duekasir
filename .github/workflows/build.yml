name: Build DR Aquatic APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true
      - run: flutter config --no-enable-windows-desktop --no-enable-macos-desktop --no-enable-linux-desktop --no-enable-web
      - run: flutter pub get
      - name: Patch old project to work with new libs
        run: |
          echo "Patching Kotlin & Gradle & SDK..."
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i "s/ext.kotlin_version = \".*\"/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:7.4.2'/" android/build.gradle
          sed -i "s/com.android.tools.build:gradle:\".*\"/com.android.tools.build:gradle:7.4.2'/" android/build.gradle
          sed -i "s/compileSdkVersion.*/compileSdkVersion 33/" android/app/build.gradle
          sed -i "s/compileSdk.*/compileSdk 33/" android/app/build.gradle
          sed -i "s/targetSdkVersion.*/targetSdkVersion 33/" android/app/build.gradle
          sed -i "s/targetSdk.*/targetSdk 33/" android/app/build.gradle
          find $HOME/.pub-cache -name "pubspec.yaml" -path "*print_bluetooth_thermal*" -exec sed -i '/PrintBluetoothThermalPlugin:windows/d; /windows:/d' {} \; || true
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: DR-Aquatic-APK
          path: build/app/outputs/flutter-apk/app-release.apk
