name: Build DR Aquatic FINAL FIX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - name: Patch all
        run: |
          flutter config --no-enable-windows-desktop --no-enable-macos-desktop --no-enable-linux-desktop --no-enable-web
          sed -i 's/print_bluetooth_thermal:.*/print_bluetooth_thermal: 1.2.1/' pubspec.yaml
          flutter pub get || true
          python3 -c "
          import glob, re, os
          for p in glob.glob(os.path.expanduser('~/.pub-cache/**/print_bluetooth_thermal*/pubspec.yaml'), recursive=True):
            t=open(p).read()
            t=re.sub(r'\n\s+windows:\n(?:\s+.*\n)+', '\n', t)
            open(p,'w').write(t)
            print('patched', p)
          "
          # INI YANG KEMARIN KELEWAT - PATCH SETTINGS.GRADLE
          echo '--- settings.gradle before ---'
          cat android/settings.gradle
          sed -i -E "s/org.jetbrains.kotlin.android\" version \".*\"/org.jetbrains.kotlin.android\" version \"1.9.22\"/" android/settings.gradle
          sed -i -E "s/org.jetbrains.kotlin.android' version '.*'/org.jetbrains.kotlin.android' version '1.9.22'/" android/settings.gradle
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[0-9.]+"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          # PATCH BUILD.GRADLE JUGA
          sed -i -E "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i -E 's/ext.kotlin_version = ".*"/ext.kotlin_version = "1.9.22"/' android/build.gradle || true
          sed -i -E "s/kotlin-gradle-plugin:.*'/kotlin-gradle-plugin:1.9.22'/" android/build.gradle || true
          sed -i -E "s/com.android.tools.build:gradle:.*'/com.android.tools.build:gradle:7.4.2'/" android/build.gradle || true
          sed -i "s/compileSdkVersion.*/compileSdkVersion 34/" android/app/build.gradle || true
          sed -i "s/compileSdk.*/compileSdk 34/" android/app/build.gradle || true
          sed -i "s/targetSdkVersion.*/targetSdkVersion 34/" android/app/build.gradle || true
          sed -i "s/targetSdk.*/targetSdk 34/" android/app/build.gradle || true
          echo '--- settings.gradle after ---'
          cat
