name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: false
      - name: fix all root causes
        run: |
          flutter config --no-enable-windows-desktop --no-enable-macos-desktop --no-enable-linux-desktop --no-enable-web
          flutter pub get || true
          find $HOME/.pub-cache -path "*print_bluetooth_thermal*" -name "pubspec.yaml" -exec sed -i '/windows:/d' {} \;
          sed -i -E 's/1.7.10/1.9.22/g; s/1.8.22/1.9.22/g' android/settings.gradle
          APP_ID=$(grep -o 'applicationId "[^"]*"' android/app/build.gradle | head -1 | cut -d'"' -f2)
          if [ -z "$APP_ID" ]; then APP_ID="com.example.due_kasir"; fi
          echo "APP_ID=$APP_ID"
          cat > android/app/build.gradle <<EOF
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace = "$APP_ID"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
              defaultConfig {
                  applicationId = "$APP_ID"
                  minSdk = flutter.minSdkVersion
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
          cat android/app/build.gradle
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: DR-Aquatic-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
