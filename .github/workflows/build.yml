name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: sed -i 's/gradle-.*-all.zip/gradle-8.0-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - run: |
          printf '%s\n' 'pluginManagement {' ' def flutterSdkPath = {' ' def properties = new Properties()' ' file("local.properties").withInputStream { properties.load(it) }' ' return properties.getProperty("flutter.sdk")' ' }()' ' includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")' ' repositories { google(); mavenCentral(); gradlePluginPortal() }' '}' 'plugins {' ' id "dev.flutter.flutter-plugin-loader" version "1.0.0"' ' id "com.android.application" version "8.1.0" apply false' ' id "org.jetbrains.kotlin.android" version "1.9.22" apply false' '}' 'include ":app"' > android/settings.gradle
      - run: |
          printf '%s\n' 'buildscript {' " ext.kotlin_version = '1.9.22'" ' repositories { google(); mavenCentral() }' ' dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }' '}' 'allprojects { repositories { google(); mavenCentral() } }' 'rootProject.buildDir = "../build"' 'subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }' 'subprojects { project.evaluationDependsOn(":app") }' 'tasks.register("clean", Delete) { delete rootProject.buildDir }' > android/build.gradle
      - run: |
          APP_ID=$(grep -o 'applicationId "[^"]*"' android/app/build.gradle | head -1 | cut -d'"' -f2); if [ -z "$APP_ID" ]; then APP_ID="com.example.due_kasir"; fi; printf '%s\n' "plugins { id \"com.android.application\"; id \"kotlin-android\"; id \"dev.flutter.flutter-gradle-plugin\" }" "android { namespace = \"$APP_ID\"; compileSdk = 34; ndkVersion = flutter.ndkVersion" ' compileOptions { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }' ' kotlinOptions { jvmTarget = "1.8" }' " defaultConfig { applicationId = \"$APP_ID\"; minSdk = flutter.minSdkVersion; targetSdk = 34; versionCode = flutter.versionCode; versionName = flutter.versionName }" ' buildTypes { release { signingConfig = signingConfigs.getByName("debug") } } }' 'flutter { source = "../.." }' > android/app/build.gradle
      - run: flutter config --no-enable-windows --no-enable-macos --no-enable-linux --no-enable-web
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DR-AQUATIC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DR-AQUATIC-APK
          path: build/app/outputs/flutter-apk/DR-AQUATIC.apk
